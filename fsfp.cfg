# fsfp_detect config (key=value; '#' comments). Passed as argv[1], else this file.
cpu_core       = 4      # logical core to pin to (isolated, SMT sibling idle)
training_iters = 64     # K: training reps of the pair before each WARM measurement
trials         = 4000   # averaged measurements per condition
warmup         = 200    # discarded trials up front
chain_len      = 128    # store->load pairs per timed kernel
offset_bytes   = 256    # load offset for the NON-aliasing (no-forward) condition
thrash_lines   = 4096   # distinct lines touched to reset the predictor before COLD
allow_unsafe   = 0      # 1 = run even if turbo/governor/SMT/C-state checks fail
